<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Disciplined Stakes — Goal Mark</title>
    <style>
      :root {
        color: #1c1917;
        background: #e9e5dc;
        font-family: "Avenir Next", Inter, ui-sans-serif, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 900px;
        margin: 0;
        overflow: hidden;
      }
      .canvas {
        width: 100%;
        height: 100%;
        padding: 44px;
        background:
          radial-gradient(circle at 0 0, #fffdf7 0, transparent 30%),
          #e9e5dc;
      }
      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        height: 60px;
        margin-bottom: 28px;
      }
      h1 {
        margin: 0;
        font-size: 38px;
        font-weight: 720;
        letter-spacing: -1.7px;
      }
      .meta {
        margin-bottom: 6px;
        color: #756d5c;
        font: 650 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 2px;
      }
      .layout {
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        gap: 20px;
        height: 724px;
      }
      .hero {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
        padding: 50px;
        border-radius: 30px;
        background: #ffd84d;
        color: #1c1917;
      }
      .hero-icon {
        align-self: center;
        width: 420px;
        height: 420px;
      }
      .hero-wordmark {
        font-size: 54px;
        font-weight: 700;
        letter-spacing: -2.8px;
      }
      .hero-note {
        display: flex;
        justify-content: space-between;
        margin-top: 10px;
        color: #66510a;
        font: 650 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 1.7px;
      }
      .specimen {
        display: grid;
        grid-template-rows: 1fr 1.05fr 0.8fr;
        gap: 20px;
      }
      .panel {
        overflow: hidden;
        border: 1px solid rgb(28 25 23 / 10%);
        border-radius: 26px;
        background: #fffdf7;
      }
      .panel-label {
        display: flex;
        justify-content: space-between;
        padding: 20px 22px 0;
        color: #756d5c;
        font: 650 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 1.7px;
      }
      .lockup {
        display: flex;
        align-items: center;
        gap: 18px;
        height: calc(100% - 30px);
        padding: 0 26px;
      }
      .lockup svg {
        width: 78px;
        height: 78px;
        flex: 0 0 auto;
      }
      .lockup span {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -1.7px;
      }
      .sizes {
        display: flex;
        align-items: end;
        justify-content: space-around;
        height: calc(100% - 30px);
        padding: 12px 20px 22px;
      }
      .size {
        display: grid;
        justify-items: center;
        gap: 10px;
        color: #756d5c;
        font: 600 9px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .size-box {
        display: grid;
        place-items: center;
        border-radius: 22%;
        background: #ffd84d;
      }
      .size-box svg {
        width: 100%;
        height: 100%;
      }
      .s24 { width: 24px; height: 24px; border-radius: 6px; }
      .s32 { width: 32px; height: 32px; border-radius: 8px; }
      .s48 { width: 48px; height: 48px; border-radius: 12px; }
      .s96 { width: 96px; height: 96px; border-radius: 22px; }
      .mono {
        display: grid;
        grid-template-columns: 1fr 1fr;
        height: calc(100% - 30px);
        margin-top: 12px;
      }
      .mono > div {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .mono .dark {
        background: #1c1917;
        color: #fffdf7;
      }
      .mono svg {
        width: 42px;
        height: 42px;
      }
      .mono span {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.7px;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <header>
        <h1>Disciplined Stakes <span style="color:#e6ad00">/</span> goal mark</h1>
        <div class="meta">ORIGINAL VECTOR · REFERENCE-INSPIRED</div>
      </header>

      <div class="layout">
        <section class="hero">
          <svg class="hero-icon" viewBox="0 0 512 512" aria-label="Disciplined Stakes target and arrow goal mark">
            <g fill="none" stroke="#1C1917" stroke-linecap="round" stroke-linejoin="round">
              <path d="M318 194a140 140 0 1 0 19 172" stroke-width="28"/>
              <path d="M276 236a80 80 0 1 0 12 112" stroke-width="28"/>
              <path d="m244 268 130-130" stroke-width="28"/>
            </g>
            <path d="m220 292 14-35 21 21Z" fill="#1C1917"/>
            <path d="m365 147-13-47 28-28 8 45 25-25c11 3 20 12 23 23l-25 25 45 8-28 28-47-13Z" fill="#1C1917"/>
          </svg>
          <div>
            <div class="hero-wordmark">Disciplined Stakes</div>
            <div class="hero-note"><span>GOAL</span><span>FORWARD MOTION</span></div>
          </div>
        </section>

        <section class="specimen">
          <div class="panel">
            <div class="panel-label"><span>PRIMARY LOCKUP</span><span>HORIZONTAL</span></div>
            <div class="lockup">
              <svg viewBox="0 0 512 512">
                <rect width="512" height="512" rx="112" fill="#FFD84D"/>
                <g fill="none" stroke="#1C1917" stroke-linecap="round" stroke-linejoin="round"><path d="M318 194a140 140 0 1 0 19 172" stroke-width="28"/><path d="M276 236a80 80 0 1 0 12 112" stroke-width="28"/><path d="m244 268 130-130" stroke-width="28"/></g>
                <path d="m220 292 14-35 21 21Z" fill="#1C1917"/><path d="m365 147-13-47 28-28 8 45 25-25c11 3 20 12 23 23l-25 25 45 8-28 28-47-13Z" fill="#1C1917"/>
              </svg>
              <span>Disciplined Stakes</span>
            </div>
          </div>

          <div class="panel">
            <div class="panel-label"><span>APP ICON</span><span>SMALL-SIZE TEST</span></div>
            <div class="sizes">
              <div class="size"><div class="size-box s24"><svg viewBox="0 0 512 512"><g fill="none" stroke="#1C1917" stroke-linecap="round" stroke-linejoin="round"><path d="M318 194a140 140 0 1 0 19 172" stroke-width="38"/><path d="M276 236a80 80 0 1 0 12 112" stroke-width="38"/><path d="m244 268 130-130" stroke-width="38"/></g><path d="m220 292 14-35 21 21Z" fill="#1C1917"/><path d="m365 147-13-47 28-28 8 45 25-25c11 3 20 12 23 23l-25 25 45 8-28 28-47-13Z" fill="#1C1917"/></svg></div><span>24</span></div>
              <div class="size"><div class="size-box s32"><svg viewBox="0 0 512 512"><g fill="none" stroke="#1C1917" stroke-linecap="round" stroke-linejoin="round"><path d="M318 194a140 140 0 1 0 19 172" stroke-width="34"/><path d="M276 236a80 80 0 1 0 12 112" stroke-width="34"/><path d="m244 268 130-130" stroke-width="34"/></g><path d="m220 292 14-35 21 21Z" fill="#1C1917"/><path d="m365 147-13-47 28-28 8 45 25-25c11 3 20 12 23 23l-25 25 45 8-28 28-47-13Z" fill="#1C1917"/></svg></div><span>32</span></div>
              <div class="size"><div class="size-box s48"><svg viewBox="0 0 512 512"><g fill="none" stroke="#1C1917" stroke-linecap="round" stroke-linejoin="round"><path d="M318 194a140 140 0 1 0 19 172" stroke-width="31"/><path d="M276 236a80 80 0 1 0 12 112" stroke-width="31"/><path d="m244 268 130-130" stroke-width="31"/></g><path d="m220 292 14-35 21 21Z" fill="#1C1917"/><path d="m365 147-13-47 28-28 8 45 25-25c11 3 20 12 23 23l-25 25 45 8-28 28-47-13Z" fill="#1C1917"/></svg></div><span>48</span></div>
              <div class="size"><div class="size-box s96"><svg viewBox="0 0 512 512"><g fill="none" stroke="#1C1917" stroke-linecap="round" stroke-linejoin="round"><path d="M318 194a140 140 0 1 0 19 172" stroke-width="28"/><path d="M276 236a80 80 0 1 0 12 112" stroke-width="28"/><path d="m244 268 130-130" stroke-width="28"/></g><path d="m220 292 14-35 21 21Z" fill="#1C1917"/><path d="m365 147-13-47 28-28 8 45 25-25c11 3 20 12 23 23l-25 25 45 8-28 28-47-13Z" fill="#1C1917"/></svg></div><span>96</span></div>
            </div>
          </div>

          <div class="panel">
            <div class="panel-label"><span>ONE COLOR</span><span>LIGHT + DARK</span></div>
            <div class="mono">
              <div>
                <svg viewBox="0 0 512 512"><g fill="none" stroke="#1C1917" stroke-linecap="round" stroke-linejoin="round"><path d="M318 194a140 140 0 1 0 19 172" stroke-width="28"/><path d="M276 236a80 80 0 1 0 12 112" stroke-width="28"/><path d="m244 268 130-130" stroke-width="28"/></g><path d="m220 292 14-35 21 21Z" fill="#1C1917"/><path d="m365 147-13-47 28-28 8 45 25-25c11 3 20 12 23 23l-25 25 45 8-28 28-47-13Z" fill="#1C1917"/></svg>
                <span>Disciplined Stakes</span>
              </div>
              <div class="dark">
                <svg viewBox="0 0 512 512"><g fill="none" stroke="#FFFDF7" stroke-linecap="round" stroke-linejoin="round"><path d="M318 194a140 140 0 1 0 19 172" stroke-width="28"/><path d="M276 236a80 80 0 1 0 12 112" stroke-width="28"/><path d="m244 268 130-130" stroke-width="28"/></g><path d="m220 292 14-35 21 21Z" fill="#FFFDF7"/><path d="m365 147-13-47 28-28 8 45 25-25c11 3 20 12 23 23l-25 25 45 8-28 28-47-13Z" fill="#FFFDF7"/></svg>
                <span>Disciplined Stakes</span>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
